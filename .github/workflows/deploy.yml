# GitHub Pages cannot execute Next.js Route Handlers.
# This workflow:
#   1. Points Pages at GitHub Actions (workflow source)
#   2. Deploys a Node API (Cloudflare Worker) with TYPESAFE_API_KEY as a
#      server-side Worker secret — never NEXT_PUBLIC_*
#   3. Publishes a GHCR image for `next start` (pass TYPESAFE_API_KEY at runtime)
#   4. Statically exports the UI (basePath /cv-by-jev) to GitHub Pages
#
# Required repo secret: TYPESAFE_API_KEY
# Optional repo secrets (Jev on the public URL): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

jobs:
  api:
    name: Deploy match API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      url: ${{ steps.worker-url.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Bundle match API Worker
        continue-on-error: true
        run: |
          npx --yes esbuild api-worker/index.ts \
            --bundle \
            --format=esm \
            --outfile=dist/worker.js \
            --platform=node \
            --target=es2022 \
            --alias:@=./src \
            --external:jsdom \
            --external:@mozilla/readability

      - name: Set up Docker Buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GHCR image
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

      - name: Deploy Cloudflare Worker
        id: wrangler
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy dist/worker.js --name cv-by-jev-api --compatibility-date 2026-09-19 --compatibility-flags nodejs_compat
          secrets: |
            TYPESAFE_API_KEY
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}

      - name: Record Worker URL
        id: worker-url
        env:
          WORKER_URL: ${{ steps.wrangler.outputs.deployment-url }}
        run: |
          if [ -n "$WORKER_URL" ]; then
            echo "url=${WORKER_URL%/}" >> "$GITHUB_OUTPUT"
            echo "Match API origin recorded for the Pages build."
          else
            echo "url=" >> "$GITHUB_OUTPUT"
            echo "Cloudflare Worker was not deployed; Pages will use the in-browser heuristic fallback until CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are set."
          fi

  pages:
    name: Deploy GitHub Pages
    needs: api
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use GitHub Actions as Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api -X PUT "repos/${{ github.repository }}/pages" \
            -H "Accept: application/vnd.github+json" \
            -f build_type=workflow >/tmp/pages-put.json 2>/tmp/pages-put.err
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Pages PUT returned a non-zero status (site may already use workflow builds)."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Strip Route Handlers for static export
        run: rm -rf src/app/api

      - name: Build static UI
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /cv-by-jev
          NEXT_PUBLIC_MATCH_API_BASE: ${{ needs.api.outputs.url }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
