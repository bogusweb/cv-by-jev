# GitHub Pages cannot execute Next.js Route Handlers.
# This workflow:
#   1. Deploys a Node API (Cloudflare Worker) with TYPESAFE_API_KEY as a
#      server-side Worker secret — never NEXT_PUBLIC_*
#   2. Publishes a GHCR image for `next start` (pass TYPESAFE_API_KEY at runtime)
#   3. Statically exports the UI (basePath /cv-by-jev) and publishes it
#
# Required repo secret: TYPESAFE_API_KEY
# Optional repo secrets (Jev on the public URL): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  packages: write

jobs:
  api:
    name: Deploy match API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      url: ${{ steps.worker-url.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Bundle match API Worker
        continue-on-error: true
        run: |
          npx --yes esbuild api-worker/index.ts \
            --bundle \
            --format=esm \
            --outfile=dist/worker.js \
            --platform=node \
            --target=es2022 \
            --alias:@=./src \
            --external:jsdom \
            --external:@mozilla/readability

      - name: Set up Docker Buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GHCR image
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

      - name: Deploy Cloudflare Worker
        id: wrangler
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          set +e
          if [ ! -f dist/worker.js ]; then
            echo "Worker bundle missing; skip Cloudflare deploy."
            exit 0
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skip Worker deploy."
            exit 0
          fi
          if [ -n "$TYPESAFE_API_KEY" ]; then
            echo "::add-mask::$TYPESAFE_API_KEY"
          fi
          npx --yes wrangler deploy dist/worker.js \
            --name cv-by-jev-api \
            --compatibility-date 2026-09-19 \
            --compatibility-flags nodejs_compat \
            | tee /tmp/wrangler-deploy.txt
          deploy_status=${PIPESTATUS[0]}
          if [ -n "$TYPESAFE_API_KEY" ]; then
            printf '%s' "$TYPESAFE_API_KEY" | npx --yes wrangler secret put TYPESAFE_API_KEY --name cv-by-jev-api
          fi
          url=$(grep -oE 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wrangler-deploy.txt | head -1)
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"
          exit $deploy_status

      - name: Record Worker URL
        id: worker-url
        env:
          WORKER_URL: ${{ steps.wrangler.outputs.url }}
        run: |
          if [ -n "$WORKER_URL" ]; then
            echo "url=${WORKER_URL%/}" >> "$GITHUB_OUTPUT"
            echo "Match API origin recorded for the Pages build."
          else
            echo "url=" >> "$GITHUB_OUTPUT"
            echo "Cloudflare Worker was not deployed; Pages will use the in-browser heuristic fallback until CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are set."
          fi

  pages:
    name: Deploy GitHub Pages
    needs: api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api -X PUT "repos/${{ github.repository }}/environments/github-pages" \
            -H "Accept: application/vnd.github+json" \
            --input - <<'EOF'
          {"prevent_self_review":false,"reviewers":[],"deployment_branch_policy":null}
          EOF
          gh api -X PUT "repos/${{ github.repository }}/pages" \
            -H "Accept: application/vnd.github+json" \
            --input - <<'EOF'
          {"build_type":"workflow"}
          EOF
          gh api -X PUT "repos/${{ github.repository }}/pages" \
            -H "Accept: application/vnd.github+json" \
            --input - <<'EOF'
          {"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}
          EOF
          set -e
          echo "Pages configuration attempted (workflow and/or gh-pages branch)."

      - name: Setup Pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Strip Route Handlers for static export
        run: rm -rf src/app/api

      - name: Build static UI
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /cv-by-jev
          NEXT_PUBLIC_MATCH_API_BASE: ${{ needs.api.outputs.url }}
        run: npm run build

      - name: Upload Pages artifact
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages (Actions)
        continue-on-error: true
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish static site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
          enable_jekyll: false
